<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="calc.css" />
    <title>Calculator</title>

</head>
<body>
<div class="main-window">
	<div class="title-bar">
		<div class="title-bar-left-side">
			<img src="CalcXP.ico" class="app-icon" />
			<div>&#8211 Калькулятор</div>
		</div>
		<div class="title-bar-right-side">
			<button class="control-button">				<div class="exp_">&#x1F5D5</div></button>
			<button class="control-button" disabled>	<div class="exp-">&#128470</div></button>
			<button class="control-button close-button"><div class="expx">&#10006</div></button>
		</div>
    </div>
    <!-- ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ -->
    <div class="client-rect">
		<div class="work-area">
			<div class="menu-bar">
				<button class="menu-button">Правка</button>
				<button class="menu-button">Вид</button>
				<button class="menu-button">Справка</button>
			</div>
			<div class="display-container">
				<input type="text" class="display" />
			</div>
		</div>
    </div>
</div>
</body>
</html>
