<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
	<meta charset="UTF-8" />
	<link href="forms_and_events.css" rel="stylesheet" />
	<title>Формы и события</title>
</head>
<!--<body onmousemove="traceMouse(event)">-->
<body class="light">
	<div class="header">
		<div>Header</div>
		<div id="mouse"></div>
		<div id="switch-bg-container">
			<div>
				<label for="delay">Delay:</label>
				<input type="number" min="1" max="9" value="3" id="switch-bg-delay">
			</div>
			<div id="debug-background"></div>
			<div id="switch-background"></div>
		</div>
		<!--<img src="moon.png" id="switch-background">-->
		<!--<img src="moon.png" id="switch-background">-->
	</div>
	<hr />
	<!-- /--/--/--/--/--/--/--/--/--/--/--/--/--/--/--/--/--/--/--/-- -->
	<h1>Формы и события</h1>
	<details>
		<summary>Простейшие задачи</summary>
		<hr />
		<h2>Factorial</h2>
		<div class="task">
			<!--<div id="pair">-->
			<label for="number">Введите целое число от 0 до ~ :</label>
			<input id="number" type="number" min="0" onchange="Factorial()" />
			<!--</div>-->
			<button onclick="Factorial()">Вычислить</button>
			<br />
			<div id="result" class="result"></div>
			<!--<input id="factorial-result" class="result" type="text">-->
		</div>
		<hr />
		<!-- /--/--/--/--/--/--/--/--/--/--/--/--/--/--/--/--/--/--/--/-- -->
		<h2>Power</h2>
		<div class="task">
			<!--<div id="pair">-->
			<label for="number_p">Введите, возводимое в степень, целое число от 1 до ~ :</label>
			<input id="number_p" type="number" min="1" onchange="Power()" /><br />
			<label for="power_p" style="padding-left:35px">Введите целое число от 1 до ~ в качестве степени:</label>
			<input id="power_p" type="number" min="1" onchange="Power()" /><br />
			<div style="display:flex">
				<div id="result_p" class="result"></div>
				<button onclick="Power()">Вычислить</button>
			</div>
			<br />
			<!--</div>-->
		</div>
		<hr />
		<!-- /--/--/--/--/--/--/--/--/--/--/--/--/--/--/--/--/--/--/--/-- -->
		<div class="task">
			<h2>Фибоначчи</h2>
			<!--<div id="pair">-->
			<label for="number_f">Введите целое число от 1 до ~ :</label>
			<input id="number_f" type="number" min="0" onchange="Fibona44i()" /><br />
			<div style="display:flex">
				<div id="result_f" class="result"></div>
				<button onclick="Fibona44i()">Вычислить</button>
			</div>
			<!--</div>-->
		</div>
	</details>
	<!-- /--/--/--/--/--/--/--/--/--/--/--/--/--/--/--/--/--/--/--/-- -->
	<details>
		<summary>Фото и цвета</summary>
		<div class="images-and-colors">
			<div class="upload-image">
				<div class="image-container">
					<img alt="Фото студента" id="image" />
				</div>
				<input type="file" id="image-file" onchange="setImage()" />
			</div>

			<div class="select-colors">
				<label for="background-color">Цвет фона</label>
				<input type="color" id="background-color" value="white" oninput='setColor(event)' />
			</div>
			<div class="select-colors">
				<label for="foreground-color">Цвет текста</label>
				<input type="color" id="foreground-color" value="black" oninput="setColor(event)" />
			</div>
		</div>
	</details>
	<!-- /--/--/--/--/--/--/--/--/--/--/--/--/--/--/--/--/--/--/--/-- -->
	<details>
		<summary>Дата и время</summary>
		<h2 id="raw-date"></h2>
		<div id="clock">
			<h2>Time</h2>
			<div id="current-time">
				<span id="hours"></span> :
				<span id="minutes"></span> :
				<span id="seconds"></span>
			</div>
			<div id="current-date">
				<span id="yers"></span> .
				<span id="months"></span> .
				<span id="days"></span>
			</div>
			<div id="day-of-week"></div>
			<div id="clock-controls">
				<input type="checkbox" id="show-date" /><label for="show-date">Показать дату</label><br />
				<input type="checkbox" id="show-weekday" /><label for="show-weekday">Показать день недели</label>
			</div>

		</div>
	</details>
	<!-- /--/--/--/--/--/--/--/--/--/--/--/--/--/--/--/--/--/--/--/-- -->
	<div id="countdown-timer">
		<h2>Countdown timer</h2>
		<input type="date" id="target-date" value="2026-08-01"/>
		<input type="time" id="target-time" value="10:00" />
		<input type="button" id="btn-start" value="Start"/>
	</div>
	<div id="debug">
		<div id="target-date-value"></div>
		<div id="target-time-value"></div>
		<div id="target-current-time-value"></div>
		<div id="duration"></div>
		<div id="timestamp"></div>
	</div>
	<div id="display">
		<div class="time-block">
			<div id="hours-unit" class="time-unit"></div>
			<div id="hours-marker" class="time-marker">Hours</div>
		</div>
		<div class="time-block">
			<div id="minutes-unit" class="time-unit"></div>
			<div id="minutes-marker" class="time-marker">Minutes</div>
		</div>
		<div class="time-block">
			<div id="seconds-unit" class="time-unit"></div>
			<div id="seconds-marker" class="time-marker">Seconds</div>
		</div>
	</div>
	<!--document.body['style']['color']='white';-->
	<script charset="utf-8" src="forms_and_events.js"></script>


</body>
</html>
